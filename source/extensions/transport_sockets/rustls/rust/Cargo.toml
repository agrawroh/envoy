[package]
name = "envoy-rustls-ktls"
version = "0.1.0"
edition = "2021"
authors = ["Envoy Proxy Authors <envoy-dev@googlegroups.com>"]
description = "Rustls TLS transport socket with kTLS support for Envoy"
license = "Apache-2.0"

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { path = "../../../dynamic_modules/sdk/rust" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[lib]
path = "rustls_ktls.rs"
crate-type = ["staticlib"]
