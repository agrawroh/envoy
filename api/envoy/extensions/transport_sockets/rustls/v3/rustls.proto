syntax = "proto3";

package envoy.extensions.transport_sockets.rustls.v3;

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.transport_sockets.rustls.v3";
option java_outer_classname = "RustlsProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/transport_sockets/rustls/v3;rustlsv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: ``rustls`` transport socket]
// [#extension: envoy.transport_sockets.rustls]

// Configuration for upstream TLS connections using the ``rustls`` library with optional
// kernel TLS (``kTLS``) offload on Linux. ``rustls`` is a pure Rust TLS implementation
// that supports TLS 1.2 and TLS 1.3 with the ``ring`` cryptographic backend.
//
// When ``kTLS`` is enabled, the kernel handles symmetric encryption and decryption after
// the TLS handshake completes, reducing CPU usage for bulk data transfer.
//
// .. warning::
//   This extension is **alpha** and intentionally does not yet support the full configuration
//   surface of :ref:`envoy.transport_sockets.tls
//   <envoy_v3_api_msg_extensions.transport_sockets.tls.v3.UpstreamTlsContext>`. The following
//   are not supported and connections that require them will be refused at
//   ``createTransportSocket`` time (visible as ``upstream_cx_connect_fail`` with a warn log):
//
//   * Per-connection SNI override (e.g. ``auto_sni: true``).
//   * Per-connection ALPN override.
//   * Per-connection SAN match list override (``match_typed_subject_alt_names`` /
//     ``verify_subject_alt_name``).
//   * Certificate revocation (CRL / OCSP).
//   * SDS-managed certificate rotation.
//   * Fine-grained ``TlsParameters`` (cipher / version restrictions).
//
//   **Authorization / observability gap**: ``Network::Connection::ssl()`` returns ``nullptr``
//   for this transport socket. Filters and access-log formatters that consume TLS metadata —
//   notably ``envoy.filters.http.rbac`` / ``envoy.filters.network.rbac`` (the
//   ``AuthenticatedMatcher`` and URI/DNS-SAN principal matchers), ``envoy.filters.http.ext_authz``
//   (peer-cert subject/SAN propagation), and access-log operators ``%DOWNSTREAM_TLS_VERSION%``
//   / ``%DOWNSTREAM_TLS_CIPHER%`` / ``%DOWNSTREAM_PEER_CERT*%`` / ``%UPSTREAM_TLS_*%`` — will
//   behave as if the connection were plaintext. **Do not route through this socket from a
//   listener whose filter chain depends on TLS-derived principals or audit fields** until the
//   ``Ssl::ConnectionInfo`` plumbing lands.
//
//   For any of the above gaps, use :ref:`envoy.transport_sockets.tls
//   <envoy_v3_api_msg_extensions.transport_sockets.tls.v3.UpstreamTlsContext>` instead.
// [#next-free-field: 8]
message RustlsUpstreamTlsContext {
  // PEM-encoded certificate chain for client authentication (mTLS). Can be inline PEM content
  // or a filesystem path to a PEM file.
  //
  // When not specified, the connection uses server-only authentication.
  string cert_chain = 1;

  // PEM-encoded private key for client authentication (mTLS). Can be inline PEM content
  // or a filesystem path to a PEM file. Required when ``cert_chain`` is specified.
  string private_key = 2;

  // PEM-encoded trusted CA certificates for server certificate verification. Can be inline PEM
  // content or a filesystem path to a PEM file.
  //
  // If not specified, the default ``webpki`` root certificates are used.
  string trusted_ca = 3;

  // ALPN protocols to advertise during the TLS handshake (e.g., ``h2``, ``http/1.1``).
  //
  // If not specified, no ALPN is advertised.
  repeated string alpn_protocols = 4;

  // Server Name Indication (SNI) hostname used for TLS server certificate verification.
  //
  // **Required.** rustls verifies the server certificate's SAN list against this value, so it
  // must match the expected upstream hostname (e.g. ``mybucket.s3.amazonaws.com``). A factory
  // built without a non-empty ``sni`` will be rejected at config-load time. Per-connection SNI
  // overrides (e.g. cluster ``auto_sni: true``) are not yet plumbed through — see the
  // limitation note at the top of this message.
  string sni = 5;

  // Enables kernel TLS (``kTLS``) offload after the TLS handshake completes on Linux. When
  // enabled, both the TX (transmit) and RX (receive) directions are offloaded to the kernel,
  // reducing context switches and CPU usage for bulk data transfer.
  //
  // Defaults to ``false``.
  bool enable_ktls = 6;

  // When ``true`` together with ``enable_ktls``, would disable ``kTLS`` offload for the receive
  // (RX) direction so the RX path remains in userspace via ``rustls`` while TX is still
  // offloaded to the kernel.
  //
  // **Not yet supported in this alpha extension.** Setting this to ``true`` together with
  // ``enable_ktls: true`` will be rejected at config-load time. Until a proper TX-only path
  // lands (which requires keeping the rustls ``Connection`` alive after install so RX bytes
  // can be decrypted in userspace), enable ``kTLS`` for both directions or not at all.
  //
  // Has no effect when ``enable_ktls`` is ``false``.
  //
  // Defaults to ``false``.
  bool disable_ktls_rx = 7;
}

// Configuration for downstream TLS listeners using the ``rustls`` library with optional
// kernel TLS (``kTLS``) offload on Linux. Both ``cert_chain`` and ``private_key`` are
// required for downstream listeners.
//
// .. warning::
//   This extension is **alpha** and does not yet support the full configuration surface of
//   :ref:`envoy.transport_sockets.tls
//   <envoy_v3_api_msg_extensions.transport_sockets.tls.v3.DownstreamTlsContext>`. Not yet
//   supported: SDS-managed certificate rotation, multi-cert (SNI-based selection) listeners,
//   client certificate revocation (CRL / OCSP), fine-grained ``TlsParameters`` (cipher /
//   version restrictions), and ``require_client_certificate``. Use the standard TLS extension
//   if you need any of these.
//
//   **Authorization / observability gap**: ``Network::Connection::ssl()`` returns ``nullptr``
//   on the downstream side as well. Listeners whose filter chains rely on mTLS-authenticated
//   principals (RBAC ``AuthenticatedMatcher``, ext_authz peer-cert propagation) or on TLS
//   access-log fields will see those fields empty/unauthenticated. **Do not route untrusted
//   downstream clients through this socket** until the ``Ssl::ConnectionInfo`` plumbing
//   lands.
// [#next-free-field: 7]
message RustlsDownstreamTlsContext {
  // PEM-encoded certificate chain presented to connecting clients. Can be inline PEM content
  // or a filesystem path to a PEM file.
  //
  // Required for downstream listeners.
  string cert_chain = 1;

  // PEM-encoded private key corresponding to the certificate chain. Can be inline PEM content
  // or a filesystem path to a PEM file.
  //
  // Required for downstream listeners.
  string private_key = 2;

  // PEM-encoded trusted CA certificates for client certificate verification (mTLS). Can be
  // inline PEM content or a filesystem path to a PEM file. When specified, client certificates
  // are required and verified against these trust anchors.
  //
  // When not specified, client certificates are not requested.
  string trusted_ca = 3;

  // ALPN protocols to advertise during the TLS handshake (e.g., ``h2``, ``http/1.1``).
  //
  // If not specified, no ALPN is advertised.
  repeated string alpn_protocols = 4;

  // Enables kernel TLS (``kTLS``) offload after the TLS handshake completes on Linux. When
  // enabled, both the TX (transmit) and RX (receive) directions are offloaded to the kernel,
  // reducing context switches and CPU usage for bulk data transfer.
  //
  // Defaults to ``false``.
  bool enable_ktls = 5;

  // When ``true`` together with ``enable_ktls``, would disable ``kTLS`` offload for the receive
  // (RX) direction so the RX path remains in userspace via ``rustls`` while TX is still
  // offloaded to the kernel.
  //
  // **Not yet supported in this alpha extension.** Setting this to ``true`` together with
  // ``enable_ktls: true`` will be rejected at config-load time. Until a proper TX-only path
  // lands (which requires keeping the rustls ``Connection`` alive after install so RX bytes
  // can be decrypted in userspace), enable ``kTLS`` for both directions or not at all.
  //
  // Has no effect when ``enable_ktls`` is ``false``.
  //
  // Defaults to ``false``.
  bool disable_ktls_rx = 6;
}
